[project]
name = "testprism"
version = "0.1.0"
description = "TestPrism evaluates AI agents' ability to write tests that detect bugs, by flipping Terminal-Bench tasks from code-generation to test-generation (analogous to SWT-bench vs SWE-bench)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.45.2",
    "asciinema>=2.4.0",
    "docker>=7.1.0",
    "openai>=1.59.9",
    "tenacity>=9.0.0",
    "tqdm>=4.67.1",
    "ruamel-yaml>=0.18.10",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
    "litellm>=1.67.5",
    "pydantic>=2.10.5",
    "typer>=0.16.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "mcp>=1.27.0",
    "boto3>=1.42.83",
    "streamlit>=1.56.0",
    "azure-identity-broker>=1.3.0",
    "msal>=1.28.0",
]

[project.optional-dependencies]
cloudgpt-proxy = [
    "litellm[proxy]>=1.67.5",
]

[project.scripts]
testprism = "testprism.cli.tb.main:app"
tb = "testprism.cli.tb.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["converters", "tasks", "testprism/harness/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["testprism"]
known-third-party = ["docker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data/*"]

[build-system]
requires = ["uv_build>=0.7.20,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "testprism"
module-root = ""

[tool.ty.src]
include = ["testprism"]
